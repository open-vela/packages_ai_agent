# ============================================================
#  手表 UI 主题文件 —— 浅色云光（Lumina）
#
#  2026-11-02：改自深色/壁纸方案。底色从「云层壁纸 + 45% 白蒙版」
#  改成纯色暖白 #F8FBFD，卡片改成实体 #E8F0F5。壁纸本身（351,000 B）
#  已不再编入固件，见 docs_ble/92 号文。
#
#  这份文件经 tools/embed_ui.py 烘焙成 ui_theme_embedded，开机由
#  ui_theme_load_string() 加载 —— 它是**最终生效**的那一份
#  （lvgl_ui_channel.c:751）。/data/ai_agent/theme.ini 在 :701 先读，
#  随后被这份覆盖，所以改这里才有效。
#
#  颜色写法： 0xRRGGBB
#  尺寸写法： 像素数
#  任何一行删掉或写错，都会自动退回默认值（ui_theme.c:17-61），不会崩。
#
#  ⚠️ 改颜色前先算对比度（正文 >= 4.5:1，大字 >= 3:1）。
#     按钮标签颜色是按底色亮度自动选的（ui_theme.c 的
#     button_label_color()），把深色语义色改成浅色会让白字落到浅底上。
# ============================================================

# ── 文字 ────────────────────────────────────────────────
# 主信息（时间、数值、列表项）—— 14.1:1 on page / 12.7:1 on card
text_primary   = 0x172a3d

# 次要信息（单位、右侧数值）—— 6.9:1 on page / 6.2:1 on card
text_secondary = 0x435a70

# 提示语（"上滑进入应用"这类）—— 5.5:1 on page / 4.9:1 on card
text_tertiary  = 0x53697e

# ── 强调色 ──────────────────────────────────────────────
# 主色：Lumina 设计稿是 #087FA9，但配白字只有 4.55:1（贴门槛），
# 这里压深到 #0A6E93（白字 5.73:1，浅底上作文字 5.51:1）。
accent  = 0x0a6e93

# 心率：设计稿原值 #BA3452，白字 5.67:1 / 浅底文字 5.46:1，直接用
heart   = 0xba3452

# 步数：原来用 Apple 的 #30d158，在浅底上只有 1.95:1（不可读），
# 压深到 #1E7A46（白字 5.35:1 / 浅底文字 5.15:1）
step    = 0x1e7a46

# 天气：设计稿原值 #A86700 在浅底是 4.39:1（正文不达标），
# 压深到 #9C6000（白字 5.14:1 / 浅底文字 4.94:1）
weather = 0x9c6000

# ── 表面 ────────────────────────────────────────────────
# 卡片/次级填充。注意 surface_hi（按下态）不在 ini 解析器里，
# 只能改 ui_theme.c:38 的默认值。
surface  = 0xe8f0f5
divider  = 0x8fa1bb

# 页面底色：暖白。这是最终可见的底色（不再有壁纸）。
bg       = 0xf8fbfd

# ── 尺寸 ────────────────────────────────────────────────
pad_page     = 20
gap_s        = 8
gap_m        = 12
gap_l        = 20
statusbar_h  = 32
radius_card  = 20
radius_row   = 16
radius_pill  = 28

# ── 蜂窝应用网格 ────────────────────────────────────────
# 中心气泡直径
bubble_base    = 88

# 边缘气泡最小缩放百分比（越小边缘越缩）
bubble_min_pct = 74
